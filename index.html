  &lt;!-- Firebase &amp; Main Application Script --&gt;
  &lt;script type=&quot;module&quot;&gt;
    import { initializeApp } from &quot;https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js&quot;;
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile,
      signOut
    } from &quot;https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js&quot;;
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      onSnapshot,
      serverTimestamp
    } from &quot;https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js&quot;;

    // =========================================================================
    // 0. FIREBASE INITIALIZATION &amp; FORUM SYNC (Rules 1, 2, 3 Compliant)
    // =========================================================================
    const appId = typeof __app_id !== &#39;undefined&#39; ? __app_id : &#39;parliamo-italiano-app&#39;;
    let firebaseApp = null;
    let auth = null;
    let dbFire = null;
    let currentFirebaseUser = null;
    let forumPostsCache = [
      {
        id: &#39;seed-1&#39;,
        category: &#39;Общение и практика&#39;,
        authorName: &#39;София (Палермо)&#39;,
        authorAvatar: &#39;🌸&#39;,
        authorLevel: &#39;B1 Средний&#39;,
        title: &#39;Ciao a tutti! Давайте знакомиться на итальянском!&#39;,
        body: &#39;Ciao! Mi chiamo Sofia e studio l’italiano perché amo la Sicilia e il mare. E tu perché studi l’italiano?&#39;,
        italianPhrase: &#39;Ciao! Mi chiamo Sofia e studio l’italiano perché amo la Sicilia!&#39;,
        likes: 14,
        replies: [
          {
            authorName: &#39;Марко (Рим)&#39;,
            authorAvatar: &#39;☕&#39;,
            text: &#39;Benvenuta Sofia! Parli già benissimo! La Sicilia è meravigliosa.&#39;
          }
        ],
        createdAtMs: Date.now() - 86400000
      },
      {
        id: &#39;seed-2&#39;,
        category: &#39;Жизнь и путешествия в Италии&#39;,
        authorName: &#39;Елена (Бергамо)&#39;,
        authorAvatar: &#39;🏛️&#39;,
        authorLevel: &#39;A2 Элементарный&#39;,
        title: &#39;Что обязательно попробовать в Бергамо и Милане?&#39;,
        body: &#39;Друзья, еду на выходные в Ломбардию! Какие фразы пригодятся в местных тратториях?&#39;,
        italianPhrase: &#39;Vorrei assaggiare i casoncelli alla bergamasca, per favore!&#39;,
        likes: 9,
        replies: [],
        createdAtMs: Date.now() - 43200000
      }
    ];

    async function initFirebaseBackend() {
      try {
        if (typeof __firebase_config === &#39;undefined&#39; || !__firebase_config) return;
        const firebaseConfig = JSON.parse(__firebase_config);
        firebaseApp = initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        dbFire = getFirestore(firebaseApp);

        // Rule 3: Auth before queries
        if (typeof __initial_auth_token !== &#39;undefined&#39; &amp;&amp; __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) =&gt; {
          currentFirebaseUser = user;
          updateUserHeaderUI();
          if (user &amp;&amp; dbFire) {
            subscribeToForumPosts();
          }
        });
      } catch (err) {
        console.warn(&#39;Firebase fallback mode active:&#39;, err);
      }
    }

    function subscribeToForumPosts() {
      if (!dbFire || !currentFirebaseUser) return;
      // Rule 1: Strict path /artifacts/{appId}/public/data/forum_posts
      const postsCol = collection(dbFire, &#39;artifacts&#39;, appId, &#39;public&#39;, &#39;data&#39;, &#39;forum_posts&#39;);
      // Rule 2: Simple collection query, sort in JS memory
      onSnapshot(postsCol, (snapshot) =&gt; {
        const livePosts = [];
        snapshot.forEach((docSnap) =&gt; {
          livePosts.push({ id: docSnap.id, ...docSnap.data() });
        });
        if (livePosts.length &gt; 0) {
          livePosts.sort((a, b) =&gt; (b.createdAtMs || 0) - (a.createdAtMs || 0));
          forumPostsCache = livePosts;
          if (window.STATE &amp;&amp; window.STATE.view === &#39;forum&#39;) {
            window.renderCurrentView();
          }
        }
      }, (error) =&gt; {
        console.warn(&#39;Forum snapshot listener warning:&#39;, error);
      });
    }

    // Expose Firebase helpers to window for UI handlers
    window.firebaseHelpers = {
      isConnected: () =&gt; Boolean(auth &amp;&amp; dbFire),
      getUser: () =&gt; currentFirebaseUser,
      getForumPosts: () =&gt; forumPostsCache,
      registerEmail: async (email, password, displayName, avatar, level) =&gt; {
        if (!auth) throw new Error(&#39;Firebase Auth недоступен&#39;);
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName });
        window.DB.userProfile = { name: displayName, email, avatar, level, isGuest: false };
        window.saveDatabase();
        updateUserHeaderUI();
        return cred.user;
      },
      loginEmail: async (email, password) =&gt; {
        if (!auth) throw new Error(&#39;Firebase Auth недоступен&#39;);
        const cred = await signInWithEmailAndPassword(auth, email, password);
        window.DB.userProfile = {
          ...window.DB.userProfile,
          name: cred.user.displayName || email.split(&#39;@&#39;)[0],
          email,
          isGuest: false
        };
        window.saveDatabase();
        updateUserHeaderUI();
        return cred.user;
      },
      logout: async () =&gt; {
        if (auth) {
          await signOut(auth);
          await signInAnonymously(auth);
        }
        window.DB.userProfile = { name: &#39;Гость&#39;, email: &#39;&#39;, avatar: &#39;👤&#39;, level: &#39;A1 Начинающий&#39;, isGuest: true };
        window.saveDatabase();
        updateUserHeaderUI();
      },
      createForumPost: async (postData) =&gt; {
        const newPost = {
          ...postData,
          likes: 1,
          replies: [],
          createdAtMs: Date.now()
        };
        forumPostsCache.unshift({ id: &#39;local_&#39; + Date.now(), ...newPost });
        if (dbFire &amp;&amp; currentFirebaseUser) {
          const postsCol = collection(dbFire, &#39;artifacts&#39;, appId, &#39;public&#39;, &#39;data&#39;, &#39;forum_posts&#39;);
          await addDoc(postsCol, {
            ...newPost,
            uid: currentFirebaseUser.uid,
            createdAt: serverTimestamp()
          });
        }
      },
      addForumReply: async (postId, replyObj) =&gt; {
        const target = forumPostsCache.find(p =&gt; p.id === postId);
        if (!target) return;
        const updatedReplies = [...(target.replies || []), replyObj];
        target.replies = updatedReplies;
        if (dbFire &amp;&amp; currentFirebaseUser &amp;&amp; !postId.startsWith(&#39;seed-&#39;) &amp;&amp; !postId.startsWith(&#39;local_&#39;)) {
          const postRef = doc(dbFire, &#39;artifacts&#39;, appId, &#39;public&#39;, &#39;data&#39;, &#39;forum_posts&#39;, postId);
          await updateDoc(postRef, { replies: updatedReplies });
        }
      },
      likeForumPost: async (postId) =&gt; {
        const target = forumPostsCache.find(p =&gt; p.id === postId);
        if (!target) return;
        const newLikes = (target.likes || 0) + 1;
        target.likes = newLikes;
        if (dbFire &amp;&amp; currentFirebaseUser &amp;&amp; !postId.startsWith(&#39;seed-&#39;) &amp;&amp; !postId.startsWith(&#39;local_&#39;)) {
          const postRef = doc(dbFire, &#39;artifacts&#39;, appId, &#39;public&#39;, &#39;data&#39;, &#39;forum_posts&#39;, postId);
          await updateDoc(postRef, { likes: newLikes });
        }
      }
    };

    function updateUserHeaderUI() {
      const profile = window.DB?.userProfile || { name: &#39;Войти&#39;, avatar: &#39;👤&#39; };
      const nameEl = document.getElementById(&#39;header-user-name&#39;);
      const avatarEl = document.getElementById(&#39;header-user-avatar&#39;);
      if (nameEl) nameEl.textContent = profile.isGuest ? &#39;Войти&#39; : profile.name;
      if (avatarEl) avatarEl.textContent = profile.avatar || &#39;👤&#39;;
    }
    window.updateUserHeaderUI = updateUserHeaderUI;

    initFirebaseBackend();
  &lt;/script&gt;

    let italianVoice = null;

    function loadItalianVoice() {
      if (!(&#39;speechSynthesis&#39; in window)) return;
      const voices = window.speechSynthesis.getVoices();
      italianVoice =
        voices.find(v =&gt; v.lang === &#39;it-IT&#39; &amp;&amp; (v.name.includes(&#39;Google&#39;) || v.name.includes(&#39;Alice&#39;) || v.name.includes(&#39;Elsa&#39;))) ||
        voices.find(v =&gt; v.lang.toLowerCase().startsWith(&#39;it&#39;)) ||
        null;
    }

    if (&#39;speechSynthesis&#39; in window) {
      loadItalianVoice();
      window.speechSynthesis.onvoiceschanged = loadItalianVoice;
    }

    function speakItalian(text, rate = 0.92) {
      if (!(&#39;speechSynthesis&#39; in window)) {
        showToast(&#39;Озвучка не поддерживается в этом браузере&#39;, &#39;error&#39;);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = &#39;it-IT&#39;;
      if (italianVoice) utterance.voice = italianVoice;
      utterance.rate = rate;
      utterance.pitch = 1.02;
      window.speechSynthesis.speak(utterance);
    }
    window.speakItalian = speakItalian;

    function showToast(message, type = &#39;success&#39;) {
      const container = document.getElementById(&#39;toast-container&#39;);
      const el = document.createElement(&#39;div&#39;);
      const bg = type === &#39;error&#39; ? &#39;bg-rose-100 border-rose-300 text-rose-950&#39; : &#39;bg-emerald-100 border-emerald-300 text-emerald-950&#39;;
      el.className = `pointer-events-auto px-4 py-2.5 rounded-2xl border shadow-lg text-xs font-bold flex items-center gap-2 transition-all duration-300 ${bg}`;
      el.innerHTML = `&lt;span&gt;${type === &#39;error&#39; ? &#39;⚠️&#39; : &#39;✨&#39;}&lt;/span&gt;&lt;span&gt;${escapeHtml(message)}&lt;/span&gt;`;
      container.appendChild(el);
      setTimeout(() =&gt; {
        el.style.opacity = &#39;0&#39;;
        el.style.transform = &#39;translateY(-8px)&#39;;
        setTimeout(() =&gt; el.remove(), 300);
      }, 2800);
    }
    window.showToast = showToast;

    function escapeHtml(str) {
      if (str === null || str === undefined) return &#39;&#39;;
      return String(str)
        .replace(/&amp;/g, &#39;&amp;amp;&#39;)
        .replace(/&lt;/g, &#39;&amp;lt;&#39;)
        .replace(/&gt;/g, &#39;&amp;gt;&#39;)
        .replace(/&quot;/g, &#39;&amp;quot;&#39;)
        .replace(/&#39;/g, &#39;&amp;#039;&#39;);
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const clean = url.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(clean)) return clean;
      const regExp = /(?:youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = clean.match(regExp);
      return match ? match[1] : null;
    }

    async function sendAiTutorMessage(customPrompt = null) {
      const inputEl = document.getElementById(&#39;ai-tutor-input&#39;);
      const text = customPrompt !== null ? customPrompt : (inputEl ? inputEl.value.trim() : &#39;&#39;);
      if (!text || STATE.aiLoading) return;

      if (inputEl &amp;&amp; customPrompt === null) inputEl.value = &#39;&#39;;
      STATE.aiMessages.push({ role: &#39;user&#39;, text });
      STATE.aiLoading = true;
      renderCurrentView();

      const systemPrompt = `Ты — София, тёплый, вдохновляющий репетитор итальянского языка в приложении «Parliamo Italiano».
Пользователь пишет тебе на русском или итальянском. Отвечай живо, дружелюбно и понятно.
Обязательно возвращай ответ строго в формате JSON со следующими полями:
- &quot;it&quot;: твой естественный ответ или нужная пользователю фраза на итальянском языке;
- &quot;tr&quot;: практическая транскрипция итальянской фразы русскими буквами;
- &quot;ru&quot;: точный перевод на русский язык и, при необходимости, краткое объяснение грамматики, вежливых оттенков или похвала за попытку пользователя.`;

      const payload = {
        contents: [{ parts: [{ text }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: &quot;application/json&quot;,
          responseSchema: {
            type: &quot;OBJECT&quot;,
            properties: {
              it: { type: &quot;STRING&quot; },
              tr: { type: &quot;STRING&quot; },
              ru: { type: &quot;STRING&quot; }
            },
            required: [&quot;it&quot;, &quot;tr&quot;, &quot;ru&quot;]
          }
        }
      };

      const apiKey = &quot;&quot;;
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      let parsedReply = null;
      const delays = [1000, 2000, 4000];
      for (let attempt = 0; attempt &lt;= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: &#39;POST&#39;,
            headers: { &#39;Content-Type&#39;: &#39;application/json&#39; },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(&#39;HTTP &#39; + response.status);
          const result = await response.json();
          const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawJson) {
            parsedReply = JSON.parse(rawJson);
            break;
          }
        } catch (err) {
          if (attempt &lt; delays.length) {
            await new Promise(r =&gt; setTimeout(r, delays[attempt]));
          }
        }
      }

      if (!parsedReply) {
        parsedReply = {
          it: &quot;Certo! Come si dice questo in italiano? Parliamo insieme!&quot;,
          tr: &quot;Черто! Комэ си диче куэсто ин итальяно? Парльямо инсьемэ!&quot;,
          ru: &quot;Конечно! Попробуй написать простую фразу, например «Come stai?» (Как дела?) или спроси, как заказать кофе в Италии.&quot;
        };
      }

      STATE.aiMessages.push({
        role: &#39;ai&#39;,
        it: parsedReply.it,
        tr: parsedReply.tr,
        ru: parsedReply.ru
      });
      STATE.aiLoading = false;
      DB.userXp += 10;
      saveDatabase();
      renderCurrentView();
      setTimeout(() =&gt; {
        const box = document.getElementById(&#39;ai-chat-scroll&#39;);
        if (box) box.scrollTop = box.scrollHeight;
      }, 50);
    }
    window.sendAiTutorMessage = sendAiTutorMessage;

                    &lt;div class=&quot;pt-3&quot; onclick=&quot;event.stopPropagation()&quot;&gt;
                      &lt;button onclick=&#39;speakItalian(${JSON.stringify(currentWord.it)})&#39; class=&quot;px-5 py-2.5 rounded-2xl bg-sky-100 hover:bg-sky-200 text-sky-950 text-sm font-bold transition inline-flex items-center gap-2 shadow-xs&quot;&gt;

    }

    function prevFlashcard(total) {
      STATE.cardIndex = (STATE.cardIndex - 1 + total) % total;
      STATE.cardFlipped = false;
      renderCurrentView();
    }

    function nextFlashcard(total) {
      STATE.cardIndex = (STATE.cardIndex + 1) % total;
      STATE.cardFlipped = false;
      renderCurrentView();
    }

    function toggleLearnedWord(wordId) {
      const idx = DB.learnedWordIds.indexOf(wordId);
      if (idx &gt;= 0) {
        DB.learnedWordIds.splice(idx, 1);
      } else {
        DB.learnedWordIds.push(wordId);
        DB.userXp += 10;
        showToast(&#39;Отлично! Слово отмечено как выученное (+10 XP)&#39;);
      }
      saveDatabase();
      renderCurrentView();
    }

    // =========================================================================

      return `

                📅 Курс по дням (${sortedDays.length})
              &lt;/button&gt;
              &lt;button onclick=&quot;STATE.grammarSubTab=&#39;rules&#39;; renderCurrentView();&quot; class=&quot;px-4 py-2 rounded-xl text-xs font-bold transition ${STATE.grammarSubTab === &#39;rules&#39; ? &#39;bg-pink-200 text-pink-950&#39; : &#39;text-slate-600 hover:bg-slate-100&#39;}&quot;&gt;

            ${currentDay ? (lockedForFree ? `

                &lt;div class=&quot;text-4xl&quot;&gt;👑&lt;/div&gt;
                &lt;h2 class=&quot;font-lora font-bold text-2xl&quot;&gt;Урок «${escapeHtml(currentDay.title)}» доступен в PRO&lt;/h2&gt;

                  Первые 3 дня полностью открыты для всех! Оформите годовую подписку PRO (€29.90 / год), чтобы открыть все уроки с 4 по 30 день и убрать рекламу.

                ${currentDay.imageUrl ? `

                  &lt;/div&gt;

    async function submitNewForumPost() {
      const cat = document.getElementById(&#39;forum-new-cat&#39;).value;
      const title = document.getElementById(&#39;forum-new-title&#39;).value.trim();
      const itPhrase = document.getElementById(&#39;forum-new-it&#39;).value.trim();
      const body = document.getElementById(&#39;forum-new-body&#39;).value.trim();
      if (!title || !body) {
        showToast(&#39;Заполните заголовок и текст сообщения&#39;, &#39;error&#39;);
        return;
      }
      const profile = DB.userProfile || { name: &#39;Гость&#39;, avatar: &#39;🇮🇹&#39;, level: &#39;A1&#39; };
      await window.firebaseHelpers.createForumPost({
        category: cat,
        authorName: profile.name,
        authorAvatar: profile.avatar || &#39;🇮🇹&#39;,
        authorLevel: profile.level || &#39;Ученик&#39;,
        title,
        italianPhrase: itPhrase,
        body
      });
      STATE.forumShowNewForm = false;
      DB.userXp += 15;
      saveDatabase();
      showToast(&#39;Тема опубликована на форуме! +15 XP&#39;);
      renderCurrentView();
    }
    window.submitNewForumPost = submitNewForumPost;

    async function handleReplyForumPost(postId) {
      const input = document.getElementById(`reply-input-${postId}`);
      const text = input ? input.value.trim() : &#39;&#39;;
      if (!text) return;
      const profile = DB.userProfile || { name: &#39;Гость&#39;, avatar: &#39;💬&#39; };
      await window.firebaseHelpers.addForumReply(postId, {
        authorName: profile.name,
        authorAvatar: profile.avatar || &#39;💬&#39;,
        text
      });
      DB.userXp += 5;
      saveDatabase();
      showToast(&#39;Ответ добавлен! +5 XP&#39;);
      renderCurrentView();
    }
    window.handleReplyForumPost = handleReplyForumPost;

    async function handleRegisterOrLogin(mode) {
      const name = document.getElementById(&#39;auth-name-input&#39;)?.value.trim() || &#39;Ученик&#39;;
      const email = document.getElementById(&#39;auth-email-input&#39;)?.value.trim();
      const pass = document.getElementById(&#39;auth-pass-input&#39;)?.value.trim();
      const level = document.getElementById(&#39;auth-level-input&#39;)?.value || &#39;A1 Начинающий&#39;;
      const avatar = document.getElementById(&#39;auth-avatar-input&#39;)?.value || &#39;🇮🇹&#39;;

      if (!email || !pass || pass.length &lt; 6) {
        showToast(&#39;Укажите корректный Email и пароль от 6 символов&#39;, &#39;error&#39;);
        return;
      }

      try {
        if (window.firebaseHelpers &amp;&amp; window.firebaseHelpers.isConnected()) {
          if (mode === &#39;register&#39;) {
            await window.firebaseHelpers.registerEmail(email, pass, name, avatar, level);
          } else {
            await window.firebaseHelpers.loginEmail(email, pass);
          }
        } else {
          DB.userProfile = { name, email, avatar, level, isGuest: false };
          saveDatabase();
          if (window.updateUserHeaderUI) window.updateUserHeaderUI();
        }
        showToast(`Добро пожаловать, ${name}!`);
        closeAuthModal();
        renderCurrentView();
      } catch (err) {
        // Fallback local registration if email already exists or offline
        DB.userProfile = { name, email, avatar, level, isGuest: false };
        saveDatabase();
        if (window.updateUserHeaderUI) window.updateUserHeaderUI();
        showToast(`Вы вошли как ${name}!`);
        closeAuthModal();
        renderCurrentView();
      }
    }
    window.handleRegisterOrLogin = handleRegisterOrLogin;

    // =========================================================================
    // 14. QUIZ VIEW
    // =========================================================================
    function initQuiz() {
      const pool = [...DB.words].sort(() =&gt; Math.random() - 0.5).slice(0, 8);
      const questions = pool.map(word =&gt; {
        const distractors = DB.words
          .filter(w =&gt; w.id !== word.id)
          .sort(() =&gt; Math.random() - 0.5)
          .slice(0, 3)
          .map(w =&gt; w.ru);
        const options = [...distractors, word.ru].sort(() =&gt; Math.random() - 0.5);
        return { word, options, correct: word.ru };
      });
      STATE.quizState = { questions, currentIndex: 0, score: 0, answered: false, selectedOption: null, finished: false };
    }

    function answerQuiz(option) {
      const qs = STATE.quizState;
      if (qs.answered) return;
      qs.answered = true;
      qs.selectedOption = option;
      if (option === qs.questions[qs.currentIndex].correct) {
        qs.score += 1;
        DB.userXp += 15;
        saveDatabase();
        showToast(&#39;Верно! +15 XP&#39;);
      }
      renderCurrentView();
    }
    window.answerQuiz = answerQuiz;

    function nextQuizQuestion() {
      const qs = STATE.quizState;
      if (qs.currentIndex + 1 &lt; qs.questions.length) {
        qs.currentIndex += 1;
        qs.answered = false;
        qs.selectedOption = null;
      } else {
        qs.finished = true;
      }
      renderCurrentView();
    }
    window.nextQuizQuestion = nextQuizQuestion;

    function renderQuizView() {
      const qs = STATE.quizState;
      if (!qs.questions.length) initQuiz();
      const currentQ = qs.questions[qs.currentIndex];
      const board = INITIAL_LEADERBOARD.map(item =&gt;
        item.isUser ? { ...item, xp: DB.userXp } : item
      ).sort((a, b) =&gt; b.xp - a.xp);

      return `
        &lt;section class=&quot;grid grid-cols-1 lg:grid-cols-3 gap-6&quot;&gt;
          &lt;div class=&quot;lg:col-span-2 rounded-3xl bg-white p-6 sm:p-8 border border-pink-200/80 shadow-xs space-y-6&quot;&gt;
            &lt;div class=&quot;flex items-center justify-between border-b border-slate-100 pb-4&quot;&gt;
              &lt;div&gt;
                &lt;span class=&quot;px-3 py-1 rounded-full bg-pink-100 text-pink-950 text-xs font-bold&quot;&gt;Интерактивный тест&lt;/span&gt;
                &lt;h1 class=&quot;font-lora font-bold text-2xl mt-2&quot;&gt;Проверьте знание итальянских слов&lt;/h1&gt;
              &lt;/div&gt;
              &lt;button onclick=&quot;initQuiz(); renderCurrentView();&quot; class=&quot;px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold transition&quot;&gt;
                🔄 Новый тест
              &lt;/button&gt;
            &lt;/div&gt;

            ${!qs.finished &amp;&amp; currentQ ? `
              &lt;div class=&quot;space-y-5&quot;&gt;
                &lt;div class=&quot;flex items-center justify-between text-xs font-bold text-slate-500&quot;&gt;
                  &lt;span&gt;Вопрос ${qs.currentIndex + 1} из ${qs.questions.length}&lt;/span&gt;
                  &lt;span&gt;Правильных ответов: ${qs.score}&lt;/span&gt;
                &lt;/div&gt;

                &lt;div class=&quot;p-6 rounded-3xl bg-gradient-to-br from-sky-50 to-pink-50 border border-sky-100 text-center space-y-2&quot;&gt;
                  &lt;div class=&quot;text-xs font-bold uppercase tracking-wider text-slate-400&quot;&gt;Как переводится это слово?&lt;/div&gt;
                  &lt;div class=&quot;font-lora font-bold text-3xl sm:text-4xl&quot;&gt;${escapeHtml(currentQ.word.it)}&lt;/div&gt;
                  &lt;div class=&quot;text-xs text-slate-500&quot;&gt;[ ${escapeHtml(currentQ.word.tr)} ]&lt;/div&gt;
                  &lt;button onclick=&#39;speakItalian(${JSON.stringify(currentQ.word.it)})&#39; class=&quot;mt-2 px-4 py-1.5 rounded-full bg-white hover:bg-sky-100 text-xs font-bold text-sky-900 shadow-xs transition&quot;&gt;
                    🔊 Прослушать
                  &lt;/button&gt;
                &lt;/div&gt;

                &lt;div class=&quot;grid grid-cols-1 sm:grid-cols-2 gap-3&quot;&gt;
                  ${currentQ.options.map(opt =&gt; {
                    let btnStyle = &#39;bg-white hover:bg-pink-50/70 border-slate-200&#39;;
                    if (qs.answered) {
                      if (opt === currentQ.correct) btnStyle = &#39;bg-emerald-100 border-emerald-400 text-emerald-950&#39;;
                      else if (opt === qs.selectedOption) btnStyle = &#39;bg-rose-100 border-rose-400 text-rose-950&#39;;
                      else btnStyle = &#39;bg-slate-50 border-slate-200 text-slate-400&#39;;
                    }
                    return `
                      &lt;button onclick=&#39;answerQuiz(${JSON.stringify(opt)})&#39; class=&quot;p-4 rounded-2xl border-2 text-left text-sm font-bold transition ${btnStyle}&quot;&gt;
                        ${escapeHtml(opt)}
                      &lt;/button&gt;
                    `;
                  }).join(&#39;&#39;)}
                &lt;/div&gt;

                ${qs.answered ? `
                  &lt;div class=&quot;flex justify-end pt-2&quot;&gt;
                    &lt;button onclick=&quot;nextQuizQuestion()&quot; class=&quot;px-6 py-3 rounded-2xl bg-pink-200 hover:bg-pink-300 text-pink-950 font-bold text-sm transition&quot;&gt;
                      ${qs.currentIndex + 1 &lt; qs.questions.length ? &#39;Следующий вопрос →&#39; : &#39;Посмотреть результат 🏆&#39;}
                    &lt;/button&gt;
                  &lt;/div&gt;
                ` : &#39;&#39;}
              &lt;/div&gt;
            ` : `
              &lt;div class=&quot;p-8 rounded-3xl bg-gradient-to-br from-emerald-50 via-yellow-50 to-pink-50 text-center space-y-4&quot;&gt;
                &lt;div class=&quot;text-5xl&quot;&gt;🎉&lt;/div&gt;
                &lt;h2 class=&quot;font-lora font-bold text-2xl&quot;&gt;Браво! Тест завершён!&lt;/h2&gt;
                &lt;p class=&quot;text-base text-slate-700&quot;&gt;Ваш результат: &lt;span class=&quot;font-bold text-emerald-700&quot;&gt;${qs.score} из ${qs.questions.length}&lt;/span&gt;&lt;/p&gt;
                &lt;button onclick=&quot;initQuiz(); renderCurrentView();&quot; class=&quot;px-6 py-3 rounded-2xl bg-emerald-200 hover:bg-emerald-300 text-emerald-950 font-bold text-sm transition&quot;&gt;
                  Пройти ещё раз (+XP)
                &lt;/button&gt;
              &lt;/div&gt;
            `}
          &lt;/div&gt;

          &lt;div class=&quot;rounded-3xl bg-gradient-to-b from-yellow-100/80 to-amber-50/70 p-6 border border-yellow-200 space-y-4&quot;&gt;
            &lt;div class=&quot;flex items-center gap-2.5&quot;&gt;
              &lt;span class=&quot;text-2xl&quot;&gt;🏆&lt;/span&gt;
              &lt;div&gt;
                &lt;h2 class=&quot;font-lora font-bold text-xl&quot;&gt;Таблица победителей&lt;/h2&gt;
                &lt;p class=&quot;text-xs text-slate-600&quot;&gt;Зарабатывайте XP в тестах и карточках&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;space-y-2.5&quot;&gt;
              ${board.map((player, idx) =&gt; `
                &lt;div class=&quot;p-3.5 rounded-2xl flex items-center justify-between gap-2 ${player.isUser ? &#39;bg-pink-100 border-2 border-pink-300 shadow-xs&#39; : &#39;bg-white/90 border border-yellow-200/70&#39;}&quot;&gt;
                  &lt;div class=&quot;flex items-center gap-2.5&quot;&gt;
                    &lt;span class=&quot;w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold ${idx === 0 ? &#39;bg-yellow-300 text-amber-950&#39; : &#39;bg-slate-100 text-slate-600&#39;}&quot;&gt;
                      ${idx + 1}
                    &lt;/span&gt;
                    &lt;div&gt;
                      &lt;div class=&quot;text-xs sm:text-sm font-bold&quot;&gt;${escapeHtml(player.name)}&lt;/div&gt;
                      &lt;div class=&quot;text-[11px] font-semibold text-slate-500&quot;&gt;${escapeHtml(player.badge)}&lt;/div&gt;
                    &lt;/div&gt;
                  &lt;/div&gt;
                  &lt;div class=&quot;text-xs font-extrabold px-2.5 py-1 rounded-full bg-yellow-100 text-amber-950&quot;&gt;
                    ${player.xp} XP
                  &lt;/div&gt;
                &lt;/div&gt;
              `).join(&#39;&#39;)}
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      `;
    }

                  ${sortedDays.map(d =&gt; `&lt;option value=&quot;${d.dayNumber}&quot; ${d.dayNumber === STATE.adminSelectedDay ? &#39;selected&#39; : &#39;&#39;}&gt;День ${d.dayNumber} (${d.phrases.length} фраз)&lt;/option&gt;`).join(&#39;&#39;)}

      saveDatabase();
      showToast(`Создан День ${dayNum}!`);
      renderAdminBody();
    }
    window.adminCreateNextDay = adminCreateNextDay;

    function adminSaveDayMeta(dayNum) {
      const dayObj = DB.days.find(d =&gt; d.dayNumber === dayNum);
      if (!dayObj) return;
      const t = document.getElementById(&#39;admin-day-title-input&#39;)?.value.trim();
      const n = document.getElementById(&#39;admin-day-note-input&#39;)?.value.trim();
      if (t) dayObj.title = t;
      dayObj.note = n || &#39;&#39;;
      saveDatabase();
      showToast(`День ${dayNum} обновлён`);
      renderAdminBody();
    }
    window.adminSaveDayMeta = adminSaveDayMeta;

    function adminAddDayPhrase(dayNum) {
      const dayObj = DB.days.find(d =&gt; d.dayNumber === dayNum);
      if (!dayObj) return;
      const itVal = document.getElementById(&#39;admin-new-day-it&#39;).value.trim();
      const ruVal = document.getElementById(&#39;admin-new-day-ru&#39;).value.trim();
      if (!itVal || !ruVal) return showToast(&#39;Заполните оба поля&#39;, &#39;error&#39;);
      dayObj.phrases.push({ id: &#39;dp_&#39; + Date.now(), it: itVal, ru: ruVal });
      saveDatabase();
      showToast(&#39;Фраза добавлена&#39;);
      renderAdminBody();
    }
    window.adminAddDayPhrase = adminAddDayPhrase;

    function adminUpdateDayPhrase(dayNum, phraseId) {
      const dayObj = DB.days.find(d =&gt; d.dayNumber === dayNum);
      const p = dayObj?.phrases.find(item =&gt; item.id === phraseId);
      if (!p) return;
      const itVal = document.getElementById(`edit-day-it-${phraseId}`).value.trim();
      const ruVal = document.getElementById(`edit-day-ru-${phraseId}`).value.trim();
      if (itVal &amp;&amp; ruVal) {
        p.it = itVal;
        p.ru = ruVal;
        STATE.adminEditingPhraseId = null;
        saveDatabase();
        showToast(&#39;Фраза обновлена&#39;);
        renderAdminBody();
      }
    }
    window.adminUpdateDayPhrase = adminUpdateDayPhrase;

    function adminDeleteDayPhrase(dayNum, phraseId) {
      const dayObj = DB.days.find(d =&gt; d.dayNumber === dayNum);
      if (!dayObj) return;
      dayObj.phrases = dayObj.phrases.filter(item =&gt; item.id !== phraseId);
      saveDatabase();
      showToast(&#39;Фраза удалена&#39;);
      renderAdminBody();
    }
    window.adminDeleteDayPhrase = adminDeleteDayPhrase;

    function adminCreateDepartment() {
      const title = document.getElementById(&#39;new-dept-title&#39;).value.trim();
      const icon = document.getElementById(&#39;new-dept-icon&#39;).value.trim() || &#39;🇮🇹&#39;;
      const colorKey = document.getElementById(&#39;new-dept-color&#39;).value;
      const subtitle = document.getElementById(&#39;new-dept-sub&#39;).value.trim() || &#39;Авторский отдел разговорника&#39;;
      if (!title) return showToast(&#39;Введите название нового отдела&#39;, &#39;error&#39;);

      const styles = {
        pink: { bg: &#39;bg-pink-100/80 border-pink-200&#39;, badge: &#39;bg-pink-200/80 text-pink-950&#39; },
        sky: { bg: &#39;bg-sky-100/80 border-sky-200&#39;, badge: &#39;bg-sky-200/80 text-sky-950&#39; },
        emerald: { bg: &#39;bg-emerald-100/80 border-emerald-200&#39;, badge: &#39;bg-emerald-200/80 text-emerald-950&#39; },
        yellow: { bg: &#39;bg-yellow-100/80 border-yellow-200&#39;, badge: &#39;bg-yellow-200/80 text-amber-950&#39; }
      };
      const chosen = styles[colorKey] || styles.pink;
      const newId = &#39;dept_&#39; + Date.now();
      DB.themes.push({
        id: newId,
        title,
        subtitle,
        icon,
        imageUrl: &#39;&#39;,
        bgClass: chosen.bg,
        badgeClass: chosen.badge,
        phrases: []
      });
      STATE.adminSelectedThemeId = newId;
      saveDatabase();
      showToast(`Отдел «${title}» создан!`);
      renderAdminBody();
    }
    window.adminCreateDepartment = adminCreateDepartment;

    function adminAddThemePhrase(themeId) {
      const theme = DB.themes.find(t =&gt; t.id === themeId);
      if (!theme) return;
      const itVal = document.getElementById(&#39;admin-new-theme-it&#39;).value.trim();
      const trVal = document.getElementById(&#39;admin-new-theme-tr&#39;)?.value.trim() || &#39;&#39;;
      const ruVal = document.getElementById(&#39;admin-new-theme-ru&#39;).value.trim();
      if (!itVal || !ruVal) return showToast(&#39;Заполните фразу и перевод&#39;, &#39;error&#39;);
      theme.phrases.unshift({ id: &#39;tp_&#39; + Date.now(), it: itVal, tr: trVal, ru: ruVal });
      saveDatabase();
      showToast(&#39;Фраза добавлена в отдел&#39;);
      renderAdminBody();
    }
    window.adminAddThemePhrase = adminAddThemePhrase;

    function adminUpdateThemePhrase(themeId, phraseId) {
      const theme = DB.themes.find(t =&gt; t.id === themeId);
      const p = theme?.phrases.find(item =&gt; item.id === phraseId);
      if (!p) return;
      const itVal = document.getElementById(`edit-theme-it-${phraseId}`).value.trim();
      const ruVal = document.getElementById(`edit-theme-ru-${phraseId}`).value.trim();
      if (itVal &amp;&amp; ruVal) {
        p.it = itVal;
        p.ru = ruVal;
        STATE.adminEditingPhraseId = null;
        saveDatabase();
        showToast(&#39;Фраза обновлена&#39;);
        renderAdminBody();
      }
    }
    window.adminUpdateThemePhrase = adminUpdateThemePhrase;

    function adminDeleteThemePhrase(themeId, phraseId) {
      const theme = DB.themes.find(t =&gt; t.id === themeId);
      if (!theme) return;
      theme.phrases = theme.phrases.filter(item =&gt; item.id !== phraseId);
      saveDatabase();
      showToast(&#39;Фраза удалена&#39;);
      renderAdminBody();
    }
    window.adminDeleteThemePhrase = adminDeleteThemePhrase;

    function adminAddMusicClip() {
      const url = document.getElementById(&#39;admin-yt-url&#39;).value.trim();
      const title = document.getElementById(&#39;admin-yt-title&#39;).value.trim() || &#39;Итальянская песня&#39;;
      const artist = document.getElementById(&#39;admin-yt-artist&#39;).value.trim() || &#39;Musica Italiana&#39;;
      const lyricsIt = document.getElementById(&#39;admin-yt-lyrics-it&#39;).value.trim();
      const lyricsRu = document.getElementById(&#39;admin-yt-lyrics-ru&#39;).value.trim();
      const ytId = extractYouTubeId(url);
      if (!ytId) return showToast(&#39;Не удалось распознать ссылку YouTube&#39;, &#39;error&#39;);
      DB.musicClips.unshift({
        id: &#39;yt_&#39; + Date.now(),
        title,
        artist,
        youtubeId: ytId,
        lyricsIt,
        lyricsRu
      });
      saveDatabase();
      showToast(&#39;Клип добавлен и готов к просмотру!&#39;);
      renderAdminBody();
    }
    window.adminAddMusicClip = adminAddMusicClip;

    function adminDeleteMusicClip(clipId) {
      DB.musicClips = DB.musicClips.filter(c =&gt; c.id !== clipId);
      saveDatabase();
      showToast(&#39;Клип удалён&#39;);
      renderAdminBody();
    }
    window.adminDeleteMusicClip = adminDeleteMusicClip;

    function adminSaveColors() {
      DB.customColors = {
        textMain: document.getElementById(&#39;color-text-main&#39;).value,
        textHeading: document.getElementById(&#39;color-text-heading&#39;).value,
        accentPrimary: document.getElementById(&#39;color-accent-primary&#39;).value
      };
      saveDatabase();
      showToast(&#39;Новые цвета текста применены!&#39;);
    }
    window.adminSaveColors = adminSaveColors;

    function adminResetColors() {
      DB.customColors = { textMain: &#39;#2D3142&#39;, textHeading: &#39;#1E2235&#39;, accentPrimary: &#39;#F472B6&#39; };
      saveDatabase();
      showToast(&#39;Цвета возвращены по умолчанию&#39;);
      renderAdminBody();
    }
    window.adminResetColors = adminResetColors;

    function assignImageToTarget(targetStr, imageUrl) {
      const [type, id] = targetStr.split(&#39;:&#39;);
      if (type === &#39;theme&#39;) {
        const t = DB.themes.find(x =&gt; x.id === id);
        if (t) t.imageUrl = imageUrl;
      } else if (type === &#39;day&#39;) {
        const d = DB.days.find(x =&gt; x.dayNumber === Number(id));
        if (d) d.imageUrl = imageUrl;
      } else if (type === &#39;story&#39;) {
        const s = DB.stories.find(x =&gt; x.id === id);
        if (s) s.imageUrl = imageUrl;
      }
      saveDatabase();
      showToast(&#39;Картинка успешно прикреплена!&#39;);
    }

    function adminSaveImageFromUrl() {
      const target = document.getElementById(&#39;admin-img-target&#39;).value;
      const url = document.getElementById(&#39;admin-img-url&#39;).value.trim();
      if (!url) return showToast(&#39;Введите URL картинки&#39;, &#39;error&#39;);
      assignImageToTarget(target, url);
    }
    window.adminSaveImageFromUrl = adminSaveImageFromUrl;

    function adminUploadImageFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const target = document.getElementById(&#39;admin-img-target&#39;).value;
      const reader = new FileReader();
      reader.onload = function(e) {
        assignImageToTarget(target, e.target.result);
      };
      reader.readAsDataURL(file);
    }
    window.adminUploadImageFile = adminUploadImageFile;

    function adminSaveBanner() {
      DB.adBannerHtml = document.getElementById(&#39;admin-banner-code&#39;)?.value || &#39;&#39;;
      saveDatabase();
      applyAdBanner();
      showToast(&#39;Рекламный баннер сохранён!&#39;);
    }
    window.adminSaveBanner = adminSaveBanner;

    function adminClearBanner() {
      DB.adBannerHtml = &#39;&#39;;
      const el = document.getElementById(&#39;admin-banner-code&#39;);
      if (el) el.value = &#39;&#39;;
      saveDatabase();
      applyAdBanner();
      showToast(&#39;Рекламный баннер очищен&#39;);
    }
    window.adminClearBanner = adminClearBanner;

    function exportCourseJson() {
      const dataStr = JSON.stringify(DB, null, 2);
      const blob = new Blob([dataStr], { type: &#39;application/json&#39; });
      const url = URL.createObjectURL(blob);
      const a = document.createElement(&#39;a&#39;);
      a.href = url;
      a.download = `parliamo_italiano_full_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(&#39;База курса успешно экспортирована!&#39;);
    }
    window.exportCourseJson = exportCourseJson;

    function importCourseJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported &amp;&amp; Array.isArray(imported.themes)) {
            DB = { ...DB, ...imported };
            saveDatabase();
            applyAdBanner();
            renderAdminBody();
            renderCurrentView();
            showToast(&#39;База курса загружена из JSON!&#39;);
          } else {
            showToast(&#39;Неверный формат JSON&#39;, &#39;error&#39;);
          }
        } catch (err) {
          showToast(&#39;Ошибка при чтении файла&#39;, &#39;error&#39;);
        }
      };
      reader.readAsText(file);
    }
    window.importCourseJson = importCourseJson;

    function resetCourseToDefault() {
      localStorage.removeItem(STORAGE_KEY);
      DB = loadDatabase();
      saveDatabase();
      applyAdBanner();
      renderAdminBody();
      renderCurrentView();
      showToast(&#39;База возвращена к исходным материалам&#39;);
    }
    window.resetCourseToDefault = resetCourseToDefault;

    // =========================================================================
    // 16. BOOTSTRAP APPLICATION
    // =========================================================================
    window.addEventListener(&#39;DOMContentLoaded&#39;, () =&gt; {
      applyCustomColors();
      applyProStatusUI();
      updateHeaderStats();
      if (window.updateUserHeaderUI) window.updateUserHeaderUI();
      applyAdBanner();
      renderCurrentView();
    });
